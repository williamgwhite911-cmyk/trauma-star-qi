<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Trauma Star QI badge: blue and white -->
  <defs>
    <path id="arcTop" d="M 72 268 A 184 184 0 0 1 440 268"/>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9f1fa"/>
    </linearGradient>
    <linearGradient id="bodyshade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f4f8fd"/>
      <stop offset="1" stop-color="#d7e4f2"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="252" fill="url(#sky)"/>
  <circle cx="256" cy="256" r="243" fill="none" stroke="#1d63b8" stroke-width="16"/>
  <circle cx="256" cy="256" r="224" fill="none" stroke="#1d63b8" stroke-width="2.5" opacity="0.4"/>

  <!-- top arc title -->
  <text font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="800" fill="#1d63b8" letter-spacing="7">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">TRAUMA STAR</textPath>
  </text>

  <!-- AW139-style helicopter, side profile, nose right -->
  <g transform="translate(20,52) scale(0.9)" stroke="#16437e" stroke-width="2.5" stroke-linejoin="round">
    <!-- main rotor: drooped blades from hub -->
    <g stroke="#16437e" stroke-width="7" stroke-linecap="round">
      <line x1="272" y1="192" x2="98" y2="176"/>
      <line x1="272" y1="192" x2="446" y2="178"/>
      <line x1="272" y1="192" x2="180" y2="162"/>
      <line x1="272" y1="192" x2="366" y2="164"/>
    </g>
    <!-- rotor hub and mast -->
    <rect x="263" y="188" width="18" height="9" rx="4" fill="#16437e" stroke="none"/>
    <rect x="266" y="196" width="12" height="16" fill="#1d63b8"/>

    <!-- tail rotor -->
    <g stroke="#16437e" stroke-width="5.5" stroke-linecap="round">
      <line x1="86" y1="158" x2="80" y2="230"/>
      <line x1="50" y1="196" x2="116" y2="192"/>
    </g>
    <circle cx="83" cy="194" r="5.5" fill="#16437e" stroke="none"/>

    <!-- vertical fin -->
    <path d="M110 236 L88 172 Q86 164 94 162 L108 160 Q116 160 118 168 L134 230 Z" fill="#1d63b8"/>
    <!-- horizontal stabilizer -->
    <path d="M96 212 L150 206 L152 218 L100 224 Z" fill="#ffffff"/>

    <!-- tail boom, rising to tail -->
    <path d="M188 268 L118 240 Q108 236 110 228 L114 214 L188 232 Z" fill="url(#bodyshade)"/>
    <!-- boom blue stripe -->
    <path d="M188 252 L113 226 L110 236 Q110 240 118 243 L188 268 Z" fill="#1d63b8" stroke="none"/>

    <!-- fuselage: long cabin, sloped nose -->
    <path d="M182 262
             C182 230 200 210 234 204
             L340 200
             C368 200 396 214 414 234
             Q430 250 428 262
             C426 282 402 296 366 300
             L246 304
             C210 304 186 290 182 262 Z" fill="url(#bodyshade)"/>

    <!-- lower blue livery swoosh -->
    <path d="M184 270 C210 292 260 300 330 296 C368 294 404 284 424 266 Q428 262 428 258 C430 276 406 294 366 299 L246 303 C212 303 190 290 184 270 Z" fill="#1d63b8" stroke="none"/>
    <path d="M182 258 C230 274 330 276 426 254 L428 262 C404 284 340 296 268 294 C226 292 196 282 182 266 Z" fill="#4a8ad4" stroke="none" opacity="0.85"/>

    <!-- windscreen, raked -->
    <path d="M402 224 C412 232 420 242 424 252 L388 258 L380 220 Z" fill="#16437e" stroke-width="2"/>
    <!-- cockpit side window -->
    <path d="M370 220 L344 222 L346 254 L378 250 Z" fill="#16437e" stroke-width="2"/>
    <!-- cabin windows -->
    <rect x="292" y="222" width="38" height="30" rx="7" fill="#16437e" stroke-width="2"/>
    <rect x="238" y="224" width="40" height="30" rx="7" fill="#16437e" stroke-width="2"/>

    <!-- sponson -->
    <path d="M300 296 C340 296 366 290 378 282 L378 292 C370 302 342 308 308 308 L296 306 Z" fill="#1d63b8" stroke-width="2"/>

    <!-- landing gear: nose + main -->
    <g stroke="#16437e">
      <rect x="380" y="296" width="9" height="22" fill="#16437e" stroke="none"/>
      <circle cx="385" cy="326" r="13" fill="#16437e" stroke="none"/>
      <circle cx="385" cy="326" r="5" fill="#ffffff" stroke="none"/>
      <rect x="330" y="306" width="9" height="14" fill="#16437e" stroke="none"/>
      <circle cx="335" cy="330" r="14" fill="#16437e" stroke="none"/>
      <circle cx="335" cy="330" r="5.5" fill="#ffffff" stroke="none"/>
      <rect x="228" y="300" width="9" height="18" fill="#16437e" stroke="none"/>
      <circle cx="233" cy="328" r="14" fill="#16437e" stroke="none"/>
      <circle cx="233" cy="328" r="5.5" fill="#ffffff" stroke="none"/>
    </g>

    <!-- star of life on cabin -->
    <g transform="translate(216,246)" stroke="none">
      <circle r="16" fill="#1d63b8"/>
      <path d="M-2.5 -12.4 h5 v8.1 l7 -4 2.5 4.3 -7 4 7 4 -2.5 4.3 -7 -4 v8.1 h-5 v-8.1 l-7 4 -2.5 -4.3 7 -4 -7 -4 2.5 -4.3 7 4 Z" fill="#ffffff"/>
    </g>
  </g>

  <!-- QI wordmark -->
  <text x="256" y="442" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="900" fill="#1d63b8" text-anchor="middle" letter-spacing="4">QI</text>
</svg>
