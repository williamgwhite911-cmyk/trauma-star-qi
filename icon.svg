<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Trauma Star QI badge -->
  <circle cx="256" cy="256" r="252" fill="#14263c"/>
  <circle cx="256" cy="256" r="252" fill="none" stroke="#e8593a" stroke-width="18"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.55"/>

  <!-- top arc title -->
  <defs>
    <path id="arcTop" d="M 76 268 A 180 180 0 0 1 436 268"/>
  </defs>
  <text font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="7">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">TRAUMA STAR</textPath>
  </text>

  <!-- helicopter, side profile, nose right -->
  <g transform="translate(4,16)">
    <!-- main rotor -->
    <rect x="104" y="176" width="308" height="11" rx="5.5" fill="#ffffff" opacity="0.92"/>
    <rect x="244" y="184" width="22" height="26" rx="4" fill="#ffffff"/>
    <!-- tail rotor -->
    <rect x="86" y="168" width="7" height="68" rx="3.5" fill="#ffffff" opacity="0.9"/>
    <!-- tail fin -->
    <path d="M108 228 L88 194 L104 188 L124 220 Z" fill="#ffffff"/>
    <!-- tail boom -->
    <path d="M178 252 L104 234 Q96 232 97 224 L98 216 L118 214 L182 230 Z" fill="#ffffff"/>
    <!-- fuselage -->
    <path d="M172 262 C178 222 220 202 268 202 C322 202 356 224 360 252 C364 284 334 306 282 310 C228 314 182 298 172 276 Z" fill="#ffffff"/>
    <!-- livery stripe -->
    <path d="M174 272 C210 292 268 300 306 294 C334 290 352 276 358 262 L358 268 C352 292 326 306 282 310 C228 314 182 298 172 278 Z" fill="#e8593a"/>
    <!-- cockpit glass -->
    <path d="M330 224 Q348 234 352 250 L322 254 L318 222 Z" fill="#14263c"/>
    <rect x="268" y="224" width="36" height="27" rx="6" fill="#14263c"/>
    <rect x="224" y="224" width="32" height="27" rx="6" fill="#14263c"/>
    <!-- star of life roundel on tail fin area of fuselage -->
    <g transform="translate(200,262)">
      <circle r="15" fill="#1d63b8"/>
      <path d="M-2.3 -11.6 h4.6 v7.6 l6.6 -3.8 2.3 4 -6.6 3.8 6.6 3.8 -2.3 4 -6.6 -3.8 v7.6 h-4.6 v-7.6 l-6.6 3.8 -2.3 -4 6.6 -3.8 -6.6 -3.8 2.3 -4 6.6 3.8 Z" fill="#ffffff"/>
    </g>
    <!-- landing gear -->
    <circle cx="216" cy="326" r="15" fill="#ffffff"/><circle cx="216" cy="326" r="6" fill="#14263c"/>
    <circle cx="316" cy="330" r="16" fill="#ffffff"/><circle cx="316" cy="330" r="6.5" fill="#14263c"/>
    <rect x="211" y="306" width="10" height="14" fill="#ffffff"/>
    <rect x="311" y="308" width="10" height="16" fill="#ffffff"/>
  </g>

  <!-- QI wordmark -->
  <text x="256" y="436" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">QI</text>
</svg>
